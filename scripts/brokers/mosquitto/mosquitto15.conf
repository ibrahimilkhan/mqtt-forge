# Mosquitto 1.5 — the reason this file exists. It predates MQTT 5 entirely, so a CONNECT at
# protocol level 5 is refused, and the version ladder has to notice and step down to 3.1.1.
#
# 1.5 and not 1.6: MQTT 5 arrived in mosquitto 1.6.0, which accepts a v5 CONNECT without
# complaint. Nothing here is a substitute for a broker that actually says no.
listener 1883
allow_anonymous true
