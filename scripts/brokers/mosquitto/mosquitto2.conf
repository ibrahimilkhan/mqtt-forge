# Mosquitto 2 wearing every listener MQTTForge can dial, so one container covers the whole
# matrix: plain, authenticated, TLS, mutual TLS, two broken certificates, and WebSockets both
# ways. Mosquitto 2 speaks MQTT 3.1, 3.1.1 and 5.0 on all of them.
per_listener_settings true

# Plain MQTT over TCP. The baseline every other listener is compared against.
listener 1883
protocol mqtt
allow_anonymous true

# The same, but it wants a name and a password. forge / forge-secret.
listener 1884
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# TLS with a certificate that validates against the CA in ../certs — trusted only by a client
# that has been handed that CA, which is the point.
listener 8883
protocol mqtt
allow_anonymous true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Mutual TLS: no client certificate, no connection. What AWS IoT Core and most locked-down
# industrial brokers do.
listener 8884
protocol mqtt
allow_anonymous true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true

# Expired certificate, and a certificate for a name nothing here is dialled by. Both exist so
# the console has to tell them apart from "untrusted", which is what they all look like by the
# time the exception reaches it.
listener 8885
protocol mqtt
allow_anonymous true
certfile /mosquitto/certs/expired.crt
keyfile /mosquitto/certs/expired.key

listener 8886
protocol mqtt
allow_anonymous true
certfile /mosquitto/certs/wrongname.crt
keyfile /mosquitto/certs/wrongname.key

# MQTT inside a WebSocket, plain and encrypted.
listener 9001
protocol websockets
allow_anonymous true

listener 9443
protocol websockets
allow_anonymous true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
