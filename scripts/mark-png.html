<!doctype html>
<!--
  The mark on its own, as a PNG with the corners cut out, for the head of the README.

  A PNG rather than the SVG itself: GitHub serves images in a README through its own proxy, and
  what it does with an SVG has changed more than once. A raster of a drawing this flat is 15 KB
  and cannot be surprised by anything.

  512 square for a mark shown at 72, so it holds on a dense screen. The plate is rounded, so the
  background has to be nothing at all — on the white README and on the dark one both, a square of
  paper behind the corners would be the only thing on the page with a box round it:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
      --default-background-color=00000000 --screenshot=.github/assets/mark.png \
      --window-size=512,512 scripts/mark-png.html

  The drawing is web/public/favicon.svg, pasted in. Change the favicon and this has to be pasted
  again — the same rule scripts/social-card.html and scripts/make-icons.mjs follow.
-->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; padding: 0; background: transparent; }
body { width: 512px; height: 512px; }
svg { width: 512px; height: 512px; display: block; }
</style></head>
