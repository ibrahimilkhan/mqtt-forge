<!doctype html>
<!--
  The repo's social card: what a link to this repository unfurls into on X, Slack, Discord and
  the rest.

  The mark and nothing else. It was a screenshot of the whole console first — a tree, a log, a
  chart and a form, shrunk to a thumbnail nobody can read a word on — and then the mark with the
  wordmark beside it, which spends half the card saying a name the link already says underneath.
  A card this small holds one thing.

  1280x640 is the LAYOUT, and the file is three times it. That distinction has caught us out
  once: cut at 1280x640, the card is shown in a slot 1280x640 points wide on a screen with two or
  three device pixels to the point, so every pixel of it is drawn across two or three and the
  whole thing goes soft. The number in GitHub's guidance is about the shape and the aspect; the
  file wants to be denser than the slot it is shown in. 3840 is the long edge, which is under the
  4096 the unfurlers cap at, and flat colour compresses to about 60 KB against a 1 MB limit.

  GitHub crops the edges of a card on some surfaces, so nothing that matters comes within 40pt of
  one. At 400 on a card 640 tall there are 120 above and below — three times that margin.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
      --screenshot=.github/assets/social.png --window-size=1280,640 \
      --force-device-scale-factor=3 scripts/social-card.html

  The drawing is web/public/favicon.svg, pasted in rather than linked so this renders from
  anywhere. Change the favicon and this has to be pasted again — the same rule the desktop icons
  follow, which scripts/make-icons.mjs states.

  Uploading it is the one step nobody can automate: GitHub exposes the social preview through
  Settings -> General only, not through its API.
-->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; padding: 0; }
body {
  width: 1280px; height: 640px;
  /* The console's own page ground, so the card and the app are lit the same way. */
  background: #eaedf1;
  display: flex; align-items: center; justify-content: center;
}
.mark { width: 400px; height: 400px; display: block; }
</style></head>
<body>
  <svg class="mark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><defs>

  </defs>
  <rect width="24" height="24" rx="5.4" ry="5.4" fill="#0e4260"></rect>
