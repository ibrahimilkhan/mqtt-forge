<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MQFaker — Test Konsolu</title>
<style>
  :root {
    --paper:   #eaedf1;
    --surface: #ffffff;
    --ink:     #131a24;
    --muted:   #67728a;
    --rule:    #d2d8e2;
    --signal:  #b5177e;
    --live:    #0d7a63;
    --fault:   #ab3520;

    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- üst çubuk: cihaz göstergesi gibi okunur ---- */
  .bar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .wordmark span { color: var(--signal); }

  .readout {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .lamp {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  .readout[data-state="Connected"] { color: var(--live); }
  .readout[data-state="Connected"] .lamp {
    background: var(--live);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .readout[data-state="Faulted"] { color: var(--fault); }
  .readout[data-state="Faulted"] .lamp { background: var(--fault); }

  @keyframes pulse { 50% { opacity: 0.35; } }

  /* ---- yerleşim ---- */
  .layout {
    display: grid;
    grid-template-columns: minmax(320px, 400px) 1fr;
    gap: 1px;
    background: var(--rule);
    min-height: calc(100vh - 57px);
  }
  .panel { background: var(--paper); padding: 22px 20px 40px; }
  .wire  { background: var(--surface); padding: 22px 20px 40px; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---- form blokları ---- */
  .block { margin-bottom: 30px; }
  .block:last-child { margin-bottom: 0; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }

  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .row .narrow { flex: 0 0 96px; }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  input[type=text], input[type=number], input[type=password], textarea {
    width: 100%;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 8px 9px;
  }
  textarea { resize: vertical; min-height: 68px; }

  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 1px;
  }

  .checks {
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
    margin: 12px 0;
    font-family: var(--mono);
    font-size: 12px;
  }
  .checks label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: none;
    color: var(--ink);
    cursor: pointer;
  }
  .checks input { accent-color: var(--signal); }

  .actions { display: flex; gap: 8px; margin-top: 14px; }

  button {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: 2px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--surface);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--signal); border-color: var(--signal); }
  button.ghost { background: transparent; color: var(--ink); }
  button.ghost:hover:not(:disabled) { background: var(--ink); color: var(--surface); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }

  /* ---- imza öğesi: wire log ---- */
  .log { display: flex; flex-direction: column; gap: 2px; }

  .entry {
    border-left: 2px solid var(--rule);
    padding: 8px 0 10px 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    animation: arrive 0.24s ease-out;
  }
  .entry[data-kind="sent"]  { border-left-color: var(--signal); }
  .entry[data-kind="ok"]    { border-left-color: var(--live); }
  .entry[data-kind="fault"] { border-left-color: var(--fault); }

  @keyframes arrive {
    from { opacity: 0; transform: translateY(-3px); }
  }

  .entry-head {
    display: flex;
    gap: 10px;
    align-items: baseline;
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .entry[data-kind="sent"]  .verb { color: var(--signal); }
  .entry[data-kind="ok"]    .verb { color: var(--live); }
  .entry[data-kind="fault"] .verb { color: var(--fault); }
  .verb { font-weight: 600; }

  .topic { margin-top: 3px; font-size: 13px; word-break: break-all; }
  .topic .sep { color: var(--rule); margin: 0 1px; }

  .body { margin-top: 2px; color: var(--ink); word-break: break-word; }
  .entry[data-kind="fault"] .body { color: var(--fault); }

  .stamps { display: inline-flex; gap: 5px; margin-left: 8px; vertical-align: 1px; }
  .stamp {
    font-size: 9.5px;
    letter-spacing: 0.1em;
    padding: 1px 5px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--muted);
  }

  .empty {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    border-left: 2px solid var(--rule);
    padding-left: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1 class="wordmark">MQ<span>Faker</span></h1>
  <div class="readout" id="readout" data-state="Disconnected">
    <span class="lamp"></span><span id="readout-text">BAĞLI DEĞİL</span>
  </div>
</div>

<div class="layout">
  <section class="panel">

    <div class="block">
      <h2 class="eyebrow">Broker</h2>
      <div class="row">
        <div><label for="host">Sunucu</label><input type="text" id="host" value="localhost"></div>
        <div class="narrow"><label for="port">Port</label><input type="number" id="port" value="1883"></div>
      </div>
      <div class="row">
        <div><label for="clientId">İstemci kimliği</label><input type="text" id="clientId" value="mqfaker-console"></div>
      </div>
      <div class="row">
        <div><label for="username">Kullanıcı</label><input type="text" id="username" placeholder="isteğe bağlı"></div>
        <div><label for="password">Şifre</label><input type="password" id="password" placeholder="isteğe bağlı"></div>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="useTls"> TLS kullan</label>
      </div>
      <div class="actions">
        <button id="btn-connect">Bağlan</button>
        <button id="btn-disconnect" class="ghost">Bağlantıyı kes</button>
      </div>
      <p class="note" id="saved-note" hidden></p>
    </div>

    <div class="block">
      <h2 class="eyebrow">Mesaj</h2>
      <div class="row">
        <div><label for="topic">Konu</label><input type="text" id="topic" value="sensors/temp"></div>
      </div>
      <div class="row">
        <div><label for="payload">İçerik</label><textarea id="payload">23.5</textarea></div>
      </div>
      <div class="checks">
        <label><input type="radio" name="qos" value="0" checked> QoS 0</label>
        <label><input type="radio" name="qos" value="1"> QoS 1</label>
        <label><input type="radio" name="qos" value="2"> QoS 2</label>
        <label><input type="checkbox" id="retain"> Sakla</label>
      </div>
      <div class="actions">
        <button id="btn-publish">Yayınla</button>
      </div>
    </div>

  </section>

  <section class="wire">
    <h2 class="eyebrow">Hat kaydı</h2>
    <div class="log" id="log">
      <p class="empty">Henüz bir şey gönderilmedi. Bir broker'a bağlanın, sonra mesaj yayınlayın.</p>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $('log');

// Konu yolunu MQTT'deki gibi parçalara ayırıp ayraçları soluklaştırır
function renderTopic(topic) {
  return topic.split('/').map(escapeHtml).join('<span class="sep">/</span>');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function write({ kind, verb, topic, body, stamps }) {
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();

  const time = new Date().toLocaleTimeString('tr-TR', { hour12: false });
  const el = document.createElement('div');
  el.className = 'entry';
  el.dataset.kind = kind;
  el.innerHTML = `
    <div class="entry-head"><span>${time}</span><span class="verb">${escapeHtml(verb)}</span></div>
    ${topic ? `<div class="topic">${renderTopic(topic)}${stamps ? `<span class="stamps">${stamps.map(s => `<span class="stamp">${escapeHtml(s)}</span>`).join('')}</span>` : ''}</div>` : ''}
    ${body ? `<div class="body">${escapeHtml(body)}</div>` : ''}
  `;
  log.prepend(el);
}

function setState(state) {
  const map = { Connected: 'BAĞLI', Disconnected: 'BAĞLI DEĞİL', Connecting: 'BAĞLANIYOR', Faulted: 'HATA' };
  const readout = $('readout');
  readout.dataset.state = state;
  const where = state === 'Connected' ? ` · ${$('host').value}:${$('port').value}` : '';
  $('readout-text').textContent = (map[state] || state) + where;
  $('btn-publish').disabled = state !== 'Connected';
  $('btn-disconnect').disabled = state !== 'Connected';
}

// Sunucu hatalarını ProblemDetails'ten okunabilir metne çevirir
async function describeError(response) {
  try {
    const p = await response.json();
    return p.detail || p.title || `HTTP ${response.status}`;
  } catch {
    return `HTTP ${response.status}`;
  }
}

async function refreshState() {
  const r = await fetch('/api/connection');
  setState((await r.json()).state);
}

$('btn-connect').addEventListener('click', async () => {
  const payload = {
    host: $('host').value,
    port: Number($('port').value),
    clientId: $('clientId').value,
    username: $('username').value || null,
    password: $('password').value || null,
    useTls: $('useTls').checked
  };
  const r = await fetch('/api/connection', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if (r.ok) {
    setState((await r.json()).state);
    write({ kind: 'ok', verb: 'Bağlandı', body: `${payload.host}:${payload.port} · ${payload.clientId}` });
  } else {
    setState('Faulted');
    write({ kind: 'fault', verb: 'Bağlanamadı', body: await describeError(r) });
  }
});

$('btn-disconnect').addEventListener('click', async () => {
  const r = await fetch('/api/connection', { method: 'DELETE' });
  if (r.ok) {
    write({ kind: 'ok', verb: 'Bağlantı kesildi' });
    await refreshState();
  } else {
    write({ kind: 'fault', verb: 'Kesilemedi', body: await describeError(r) });
  }
});

$('btn-publish').addEventListener('click', async () => {
  const qos = Number(document.querySelector('input[name=qos]:checked').value);
  const retain = $('retain').checked;
  const topic = $('topic').value;
  const payload = $('payload').value;

  const r = await fetch('/api/publish', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topic, payload, qos, retain })
  });

  if (r.ok) {
    const stamps = [`QoS ${qos}`];
    if (retain) stamps.push('SAKLI');
    write({ kind: 'sent', verb: 'Yayınlandı', topic, body: payload, stamps });
  } else {
    write({ kind: 'fault', verb: 'Yayınlanamadı', topic, body: await describeError(r) });
  }
});

// Açılışta durumu ve kayıtlı ayarları geri yükle
(async function init() {
  await refreshState();

  const r = await fetch('/api/connection/settings');
  if (r.status !== 200) return;

  const s = await r.json();
  $('host').value = s.host;
  $('port').value = s.port;
  $('clientId').value = s.clientId;
  $('username').value = s.username || '';
  $('useTls').checked = s.useTls;

  if (s.hasPassword) {
    const note = $('saved-note');
    note.textContent = 'Şifre kaydedildi ama güvenlik gereği geri gönderilmiyor. Bağlanmak için yeniden girin.';
    note.hidden = false;
  }
})();
</script>

</body>
</html>
