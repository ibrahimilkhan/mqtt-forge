<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MQFaker — Test Konsolu</title>
<style>
  :root {
    --paper:   #eaedf1;
    --surface: #ffffff;
    --ink:     #131a24;
    --muted:   #67728a;
    --rule:    #d2d8e2;
    --signal:  #b5177e;
    --live:    #0d7a63;
    --fault:   #ab3520;

    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- üst çubuk: cihaz göstergesi gibi okunur ---- */
  .bar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .wordmark span { color: var(--signal); }

  .readout {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .lamp {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  .readout[data-state="Connected"] { color: var(--live); }
  .readout[data-state="Connected"] .lamp {
    background: var(--live);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .readout[data-state="Faulted"] { color: var(--fault); }
  .readout[data-state="Faulted"] .lamp { background: var(--fault); }

  @keyframes pulse { 50% { opacity: 0.35; } }

  /* ---- yerleşim ---- */
  /* Panel kapalıyken ağaç ve kayıt tüm genişliği alır */
  .layout {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 1px;
    background: var(--rule);
    min-height: calc(100vh - 57px);
  }
  .layout[data-panel="open"] { grid-template-columns: minmax(300px, 360px) 1.1fr 1fr; }

  .panel { background: var(--paper); padding: 22px 20px 40px; }
  .tree-pane { background: var(--surface); padding: 22px 20px 40px; }
  .wire  { background: var(--surface); padding: 22px 20px 40px; }

  @media (max-width: 1180px) {
    .layout { grid-template-columns: 1fr; }
    .layout[data-panel="open"] { grid-template-columns: minmax(280px, 340px) 1fr; }
    .wire { grid-column: 1 / -1; }
  }
  @media (max-width: 800px) {
    .layout,
    .layout[data-panel="open"] { grid-template-columns: 1fr; }
    .wire { grid-column: auto; }
  }

  /* ---- form blokları ---- */
  .block { margin-bottom: 30px; }
  .block:last-child { margin-bottom: 0; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }

  /* ---- üst çubuktaki panel menüsü ---- */
  .menu { display: flex; gap: 2px; }
  .menu-btn {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 2px;
    padding: 7px 11px;
    cursor: pointer;
  }
  .menu-btn:hover { color: var(--ink); background: var(--paper); }
  .menu-btn[aria-expanded="true"] {
    color: var(--surface);
    background: var(--ink);
    border-color: var(--ink);
  }
  .menu-btn:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }

  /* ---- açılan panelin başlığı ---- */
  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--rule);
  }
  .panel-head h2 {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .close {
    all: unset;
    margin-left: auto;
    cursor: pointer;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 2px;
  }
  .close:hover { color: var(--fault); background: var(--surface); }
  .close:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }

  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .row .narrow { flex: 0 0 96px; }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  input[type=text], input[type=number], input[type=password], textarea {
    width: 100%;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 8px 9px;
  }
  textarea { resize: vertical; min-height: 68px; }

  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 1px;
  }

  .checks {
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
    margin: 12px 0;
    font-family: var(--mono);
    font-size: 12px;
  }
  .checks label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: none;
    color: var(--ink);
    cursor: pointer;
  }
  .checks input { accent-color: var(--signal); }

  .actions { display: flex; gap: 8px; margin-top: 14px; }

  button {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: 2px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--surface);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--signal); border-color: var(--signal); }
  button.ghost { background: transparent; color: var(--ink); }
  button.ghost:hover:not(:disabled) { background: var(--ink); color: var(--surface); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }

  /* ---- imza öğesi: wire log ---- */
  .log { display: flex; flex-direction: column; gap: 2px; }

  .entry {
    border-left: 2px solid var(--rule);
    padding: 8px 0 10px 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    animation: arrive 0.24s ease-out;
  }
  .entry[data-kind="sent"]  { border-left-color: var(--signal); }
  .entry[data-kind="recv"]  { border-left-color: var(--ink); }
  .entry[data-kind="ok"]    { border-left-color: var(--live); }
  .entry[data-kind="fault"] { border-left-color: var(--fault); }

  @keyframes arrive {
    from { opacity: 0; transform: translateY(-3px); }
  }

  .entry-head {
    display: flex;
    gap: 10px;
    align-items: baseline;
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .entry[data-kind="sent"]  .verb { color: var(--signal); }
  .entry[data-kind="recv"]  .verb { color: var(--ink); }
  .entry[data-kind="ok"]    .verb { color: var(--live); }
  .entry[data-kind="fault"] .verb { color: var(--fault); }
  .verb { font-weight: 600; }

  /* aktif abonelik rozetleri */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .filters:empty { display: none; }
  .filter {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 4px 6px 4px 9px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
  }
  .filter button {
    all: unset;
    cursor: pointer;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1;
    padding: 0 2px;
  }
  .filter button:hover { color: var(--fault); }
  .filter button:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }

  .topic { margin-top: 3px; font-size: 13px; word-break: break-all; }
  .topic .sep { color: var(--rule); margin: 0 1px; }

  .body { margin-top: 2px; color: var(--ink); word-break: break-word; }
  .entry[data-kind="fault"] .body { color: var(--fault); }

  .stamps { display: inline-flex; gap: 5px; margin-left: 8px; vertical-align: 1px; }
  .stamp {
    font-size: 9.5px;
    letter-spacing: 0.1em;
    padding: 1px 5px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--muted);
  }

  .empty {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    border-left: 2px solid var(--rule);
    padding-left: 12px;
  }

  /* ---- konu ağacı: broker'ın anlık topolojisi ---- */
  .tree { font-family: var(--mono); font-size: 12.5px; }

  .node {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 3px 6px 3px calc(var(--depth) * 19px + 6px);
    border-radius: 2px;
    position: relative;
  }
  /* Boşluk yalnızca 1. seviye kardeşlere: her seviyede verilse derin
     ağaçlarda birikip gereksiz seyrelmeye yol açardı */
  .tree > .branch + .branch > .node { margin-top: 9px; }
  .node[data-branch="true"] { cursor: pointer; }
  .node[data-branch="true"]:hover { background: var(--paper); }

  .twisty {
    flex: none;
    width: 10px;
    color: var(--muted);
    font-size: 9px;
    transition: transform 0.12s ease;
  }
  .branch[data-open="false"] > .node .twisty { transform: rotate(-90deg); }
  .branch[data-open="false"] > .kids { display: none; }
  .node[data-branch="false"] .twisty { visibility: hidden; }

  .seg { flex: none; color: var(--ink); }
  .node[data-branch="true"] > .seg { font-weight: 600; }

  /* Değer konu adının hemen yanında durur; göz ikisini birlikte okur */
  .val {
    color: var(--signal);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* '=' konuyu değerden ayırır; değer yoksa hiç çıkmaz */
  .val:not(:empty)::before {
    content: '=';
    color: var(--rule);
    margin-right: 5px;
  }

  /* Özet başlığın hemen yanında durur; sağa yaslamak gözü satır boyunca gezdiriyordu */
  .meta {
    flex: none;
    font-size: 8.5px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  /* Dal açıkken içeriği zaten görünür; özet gereksiz gürültü olur.
     Yalnızca gerçek dallara uygulanır: yaprakların açılacak içeriği yok,
     kendi mesaj sayaçları her zaman görünmeli. */
  .branch[data-open="true"] > .node[data-branch="true"] > .meta { display: none; }

  /* mesaj gelince ilgili satır bir kez yanıp söner */
  .node.flash { animation: flash 700ms ease-out; }
  @keyframes flash {
    from { background: color-mix(in srgb, var(--signal) 26%, transparent); }
    to   { background: transparent; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1 class="wordmark">MQ<span>Faker</span></h1>

  <nav class="menu" aria-label="Paneller">
    <button class="menu-btn" data-panel="panel-broker" aria-expanded="false">Broker</button>
    <button class="menu-btn" data-panel="panel-subs" aria-expanded="false">Abonelik</button>
    <button class="menu-btn" data-panel="panel-publish" aria-expanded="false">Mesaj</button>
  </nav>

  <div class="readout" id="readout" data-state="Disconnected">
    <span class="lamp"></span><span id="readout-text">BAĞLI DEĞİL</span>
  </div>
</div>

<div class="layout">
  <aside class="panel" id="panel-broker" hidden>
    <div class="panel-head">
      <h2>Broker</h2>
      <button class="close" data-close aria-label="Broker panelini kapat">×</button>
    </div>
    <div class="block">
      <div class="row">
        <div><label for="host">Sunucu</label><input type="text" id="host" value="localhost"></div>
        <div class="narrow"><label for="port">Port</label><input type="number" id="port" value="1883"></div>
      </div>
      <div class="row">
        <div><label for="clientId">İstemci kimliği</label><input type="text" id="clientId" value="mqfaker-console"></div>
      </div>
      <div class="row">
        <div><label for="username">Kullanıcı</label><input type="text" id="username" placeholder="isteğe bağlı"></div>
        <div><label for="password">Şifre</label><input type="password" id="password" placeholder="isteğe bağlı"></div>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="useTls"> TLS kullan</label>
        <label><input type="checkbox" id="autoSubscribe" checked> Bağlanınca her konuya abone ol</label>
      </div>
      <div class="actions">
        <button id="btn-connect">Bağlan</button>
        <button id="btn-disconnect" class="ghost">Bağlantıyı kes</button>
      </div>
      <p class="note" id="saved-note" hidden></p>
    </div>
  </aside>

  <aside class="panel" id="panel-subs" hidden>
    <div class="panel-head">
      <h2>Abonelik</h2>
      <button class="close" data-close aria-label="Abonelik panelini kapat">×</button>
    </div>
    <div class="block">
      <div class="row">
        <div><label for="filter">Konu filtresi</label><input type="text" id="filter" value="sensors/#"></div>
      </div>
      <div class="checks">
        <label><input type="radio" name="subqos" value="0" checked> QoS 0</label>
        <label><input type="radio" name="subqos" value="1"> QoS 1</label>
        <label><input type="radio" name="subqos" value="2"> QoS 2</label>
      </div>
      <div class="actions">
        <button id="btn-subscribe">Abone ol</button>
      </div>
      <div class="filters" id="filters"></div>
    </div>
  </aside>

  <aside class="panel" id="panel-publish" hidden>
    <div class="panel-head">
      <h2>Mesaj</h2>
      <button class="close" data-close aria-label="Mesaj panelini kapat">×</button>
    </div>
    <div class="block">
      <div class="row">
        <div><label for="topic">Konu</label><input type="text" id="topic" value="sensors/temp"></div>
      </div>
      <div class="row">
        <div><label for="payload">İçerik</label><textarea id="payload">23.5</textarea></div>
      </div>
      <div class="checks">
        <label><input type="radio" name="qos" value="0" checked> QoS 0</label>
        <label><input type="radio" name="qos" value="1"> QoS 1</label>
        <label><input type="radio" name="qos" value="2"> QoS 2</label>
        <label><input type="checkbox" id="retain"> Sakla</label>
      </div>
      <div class="actions">
        <button id="btn-publish">Yayınla</button>
      </div>
    </div>
  </aside>

  <section class="tree-pane">
    <h2 class="eyebrow">Konu ağacı</h2>
    <div class="tree" id="tree">
      <p class="empty">Henüz konu yok. Bağlandığınızda broker'ın ağacı burada oluşur.</p>
    </div>
  </section>

  <section class="wire">
    <h2 class="eyebrow">Hat kaydı</h2>
    <div class="log" id="log">
      <p class="empty">Henüz bir şey gönderilmedi. Bir broker'a bağlanın, sonra mesaj yayınlayın.</p>
    </div>
  </section>
</div>

<script src="/lib/signalr.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = $('log');
const MAX_ENTRIES = 500;

// Konu yolunu MQTT'deki gibi parçalara ayırıp ayraçları soluklaştırır
function renderTopic(topic) {
  return topic.split('/').map(escapeHtml).join('<span class="sep">/</span>');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function write({ kind, verb, topic, body, stamps }) {
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();

  const time = new Date().toLocaleTimeString('tr-TR', { hour12: false });
  const el = document.createElement('div');
  el.className = 'entry';
  el.dataset.kind = kind;
  el.innerHTML = `
    <div class="entry-head"><span>${time}</span><span class="verb">${escapeHtml(verb)}</span></div>
    ${topic ? `<div class="topic">${renderTopic(topic)}${stamps ? `<span class="stamps">${stamps.map(s => `<span class="stamp">${escapeHtml(s)}</span>`).join('')}</span>` : ''}</div>` : ''}
    ${body ? `<div class="body">${escapeHtml(body)}</div>` : ''}
  `;
  log.prepend(el);

  // '#' aboneliğinde yoğun bir broker sayfayı şişirebilir; en eskileri at
  while (log.childElementCount > MAX_ENTRIES) log.lastElementChild.remove();
}

function setState(state) {
  const map = { Connected: 'BAĞLI', Disconnected: 'BAĞLI DEĞİL', Connecting: 'BAĞLANIYOR', Faulted: 'HATA' };
  const readout = $('readout');
  readout.dataset.state = state;
  const where = state === 'Connected' ? ` · ${$('host').value}:${$('port').value}` : '';
  $('readout-text').textContent = (map[state] || state) + where;
  const offline = state !== 'Connected';
  $('btn-publish').disabled = offline;
  $('btn-subscribe').disabled = offline;
  $('btn-disconnect').disabled = offline;
}

// Sunucu hatalarını ProblemDetails'ten okunabilir metne çevirir
async function describeError(response) {
  try {
    const p = await response.json();
    return p.detail || p.title || `HTTP ${response.status}`;
  } catch {
    return `HTTP ${response.status}`;
  }
}

async function refreshState() {
  const r = await fetch('/api/connection');
  setState((await r.json()).state);
}

$('btn-connect').addEventListener('click', async () => {
  const payload = {
    host: $('host').value,
    port: Number($('port').value),
    clientId: $('clientId').value,
    username: $('username').value || null,
    password: $('password').value || null,
    useTls: $('useTls').checked
  };
  const r = await fetch('/api/connection', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if (r.ok) {
    setState((await r.json()).state);
    write({ kind: 'ok', verb: 'Bağlandı', body: `${payload.host}:${payload.port} · ${payload.clientId}` });
    resetTree(); // yeni bağlantı, yeni ağaç; saklı mesajlar hemen yeniden doldurur
    if ($('autoSubscribe').checked) await subscribe('#', 0);
    await refreshFilters();
  } else {
    setState('Faulted');
    write({ kind: 'fault', verb: 'Bağlanamadı', body: await describeError(r) });
  }
});

$('btn-disconnect').addEventListener('click', async () => {
  const r = await fetch('/api/connection', { method: 'DELETE' });
  if (r.ok) {
    write({ kind: 'ok', verb: 'Bağlantı kesildi' });
    await refreshState();
    await refreshFilters();
  } else {
    write({ kind: 'fault', verb: 'Kesilemedi', body: await describeError(r) });
  }
});

$('btn-publish').addEventListener('click', async () => {
  const qos = Number(document.querySelector('input[name=qos]:checked').value);
  const retain = $('retain').checked;
  const topic = $('topic').value;
  const payload = $('payload').value;

  const r = await fetch('/api/publish', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topic, payload, qos, retain })
  });

  if (r.ok) {
    const stamps = [`QoS ${qos}`];
    if (retain) stamps.push('SAKLI');
    write({ kind: 'sent', verb: 'Yayınlandı', topic, body: payload, stamps });
  } else {
    write({ kind: 'fault', verb: 'Yayınlanamadı', topic, body: await describeError(r) });
  }
});

// ---- panel menüsü ----
const menuButtons = [...document.querySelectorAll('.menu-btn')];
const layout = document.querySelector('.layout');

// Aynı anda tek panel açılır; açık panelin düğmesi işaretli kalır
function showPanel(id) {
  for (const btn of menuButtons) {
    const acik = btn.dataset.panel === id;
    btn.setAttribute('aria-expanded', String(acik));
    $(btn.dataset.panel).hidden = !acik;
  }
  layout.dataset.panel = id ? 'open' : 'closed';
}

menuButtons.forEach(btn => btn.addEventListener('click', () => {
  const zatenAcik = btn.getAttribute('aria-expanded') === 'true';
  showPanel(zatenAcik ? null : btn.dataset.panel);
}));

document.querySelectorAll('[data-close]').forEach(btn =>
  btn.addEventListener('click', () => showPanel(null)));

showPanel('panel-broker'); // ilk iş bağlanmak; kapatıldıktan sonra menüden açılır

// ---- abonelikler ----
async function refreshFilters() {
  const filters = await (await fetch('/api/subscriptions')).json();
  const box = $('filters');
  box.textContent = '';

  for (const f of filters) {
    const chip = document.createElement('span');
    chip.className = 'filter';
    chip.append(f);

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '×';
    remove.title = `${f} aboneliğini bırak`;
    remove.addEventListener('click', () => unsubscribe(f));
    chip.append(remove);

    box.append(chip);
  }
}

async function unsubscribe(topicFilter) {
  const r = await fetch(`/api/subscriptions?topicFilter=${encodeURIComponent(topicFilter)}`, { method: 'DELETE' });
  if (r.ok) {
    write({ kind: 'ok', verb: 'Abonelik bırakıldı', topic: topicFilter });
  } else {
    write({ kind: 'fault', verb: 'Bırakılamadı', topic: topicFilter, body: await describeError(r) });
  }
  await refreshFilters();
}

async function subscribe(topicFilter, qos) {
  const r = await fetch('/api/subscriptions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topicFilter, qos })
  });

  if (r.ok) {
    write({ kind: 'ok', verb: 'Abone olundu', topic: topicFilter, stamps: [`QoS ${qos}`] });
  } else {
    write({ kind: 'fault', verb: 'Abone olunamadı', topic: topicFilter, body: await describeError(r) });
  }
}

$('btn-subscribe').addEventListener('click', async () => {
  await subscribe($('filter').value, Number(document.querySelector('input[name=subqos]:checked').value));
  await refreshFilters();
});

// ---- konu ağacı ----
const treeBox = $('tree');
const treeRoot = { children: new Map(), kidsEl: treeBox, parent: null };

function makeBranch(name, depth, parent) {
  const branchEl = document.createElement('div');
  branchEl.className = 'branch';
  branchEl.dataset.open = 'false'; // dallar kapalı başlar; özet zaten başlıkta görünür
  branchEl.dataset.name = name;

  const nodeEl = document.createElement('div');
  nodeEl.className = 'node';
  nodeEl.dataset.branch = 'false';
  nodeEl.style.setProperty('--depth', depth);

  const twisty = document.createElement('span');
  twisty.className = 'twisty';
  twisty.textContent = '▾';

  const seg = document.createElement('span');
  seg.className = 'seg';
  seg.textContent = name;

  const val = document.createElement('span');
  val.className = 'val';

  const meta = document.createElement('span');
  meta.className = 'meta';

  nodeEl.append(twisty, seg, val, meta);

  const kidsEl = document.createElement('div');
  kidsEl.className = 'kids';
  branchEl.append(nodeEl, kidsEl);

  nodeEl.addEventListener('click', () => {
    if (nodeEl.dataset.branch === 'true')
      branchEl.dataset.open = branchEl.dataset.open === 'true' ? 'false' : 'true';
  });

  // Tek kalıcı dinleyici: yanıp sönme bitince sınıfı bırakma, bayat durum kalmasın
  nodeEl.addEventListener('animationend', () => nodeEl.classList.remove('flash'));

  // Kardeşler alfabetik sırada tutulur; ağaç mesaj geldikçe zıplamaz
  let before = null;
  for (const sibling of parent.kidsEl.children) {
    if (sibling.dataset.name.localeCompare(name, 'tr') > 0) { before = sibling; break; }
  }
  parent.kidsEl.insertBefore(branchEl, before);

  return {
    children: new Map(), parent, branchEl, nodeEl, valEl: val, metaEl: meta, kidsEl,
    hits: 0,        // bu konuya doğrudan gelen mesaj sayısı
    subTopics: 0,   // altındaki (kendisi dahil) mesaj almış konu sayısı
    subMessages: 0  // altındaki (kendisi dahil) toplam mesaj sayısı
  };
}

// Dal başlıklarında alt ağacın özeti, yapraklarda konunun kendi sayacı görünür
function renderMeta(node) {
  node.metaEl.textContent = node.children.size > 0
    ? `${node.subTopics} konu · ${node.subMessages} mesaj`
    : (node.hits > 1 ? `×${node.hits}` : '');
}

function ensureNode(segments) {
  let node = treeRoot;
  segments.forEach((seg, depth) => {
    let child = node.children.get(seg);
    if (!child) {
      child = makeBranch(seg, depth, node);
      node.children.set(seg, child);
      if (node.nodeEl) {
        node.nodeEl.dataset.branch = 'true';
        renderMeta(node); // yaprakken dal oldu: sayacı özete dönüşür
      }
    }
    node = child;
  });
  return node;
}

// Kapalı bir dalın içindeki satır görünmez; o durumda en yakın görünen ataya iner
function flash(node) {
  let target = node;
  while (target.parent?.nodeEl && target.nodeEl.offsetParent === null) target = target.parent;

  const el = target.nodeEl;
  el.classList.remove('flash');
  void el.offsetWidth; // reflow: aynı satıra art arda mesaj gelirse animasyon yeniden başlasın
  el.classList.add('flash');
}

function applyToTree(message) {
  treeBox.querySelector('.empty')?.remove();

  const node = ensureNode(message.topic.split('/'));
  const firstMessageHere = node.hits === 0;

  node.hits++;
  node.valEl.textContent = message.payload;

  // Özet sayaçları kendisinden köke kadar tüm atalara yayılır
  for (let n = node; n?.nodeEl; n = n.parent) {
    n.subMessages++;
    if (firstMessageHere) n.subTopics++;
    renderMeta(n);
  }

  flash(node);
}

function resetTree() {
  treeRoot.children.clear();
  treeBox.textContent = '';
  const empty = document.createElement('p');
  empty.className = 'empty';
  empty.textContent = 'Henüz konu yok. Bağlandığınızda broker\'ın ağacı burada oluşur.';
  treeBox.append(empty);
}

// ---- canlı akış ----
const hub = new signalR.HubConnectionBuilder()
  .withUrl('/hubs/mqtt')
  .withAutomaticReconnect()
  .build();

hub.on('messageReceived', m => {
  const stamps = [`QoS ${m.qos}`];
  if (m.retain) stamps.push('SAKLI');
  write({ kind: 'recv', verb: 'Geldi', topic: m.topic, body: m.payload, stamps });
  applyToTree(m);
});

// Açılışta durumu, kayıtlı ayarları ve abonelikleri geri yükle
(async function init() {
  await hub.start();
  await refreshState();
  await refreshFilters();

  const r = await fetch('/api/connection/settings');
  if (r.status !== 200) return;

  const s = await r.json();
  $('host').value = s.host;
  $('port').value = s.port;
  $('clientId').value = s.clientId;
  $('username').value = s.username || '';
  $('useTls').checked = s.useTls;

  if (s.hasPassword) {
    const note = $('saved-note');
    note.textContent = 'Şifre kaydedildi ama güvenlik gereği geri gönderilmiyor. Bağlanmak için yeniden girin.';
    note.hidden = false;
  }
})();
</script>
