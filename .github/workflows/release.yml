name: Release

# Tag-driven: nothing ships until a version tag is pushed, so every published
# artefact is a deliberate decision rather than a side effect of a merge.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The desktop shell copies wwwroot out of the Api project, so the interface
      # has to exist before either slice is packaged — otherwise the window opens blank.
      - name: Build the interface
        run: dotnet build src/MqttForge.Api -c Release

      # Both slices come off the arm runner: -r only selects which runtime assets
      # are copied in, nothing is compiled natively.
      - name: Package arm64 and x64
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/package-macos.sh osx-arm64
          ./scripts/package-macos.sh osx-x64

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the interface
        run: dotnet build src/MqttForge.Api -c Release

      - name: Publish the desktop shell
        run: dotnet publish src/MqttForge.Desktop -c Release -r win-x64 --self-contained true -o publish

      - name: Zip it
        run: Compress-Archive -Path publish/* -DestinationPath MQTTForge-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MQTTForge-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the interface
        run: dotnet build src/MqttForge.Api -c Release

      - name: Publish the desktop shell
        run: dotnet publish src/MqttForge.Desktop -c Release -r linux-x64 --self-contained true -o publish

      # tar rather than zip: it is what keeps the executable bit, which a Linux
      # user would otherwise have to restore by hand before the app will start.
      - name: Tar it
        run: tar -czf MQTTForge-linux-x64.tar.gz -C publish .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: MQTTForge-linux-x64.tar.gz
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because a registry path must be lowercase and the owner name may not be.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        # Off because the build record it would otherwise upload lands in the same
        # artifact bucket as the packages, and the release job would attach it too.
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

  release:
    needs: [macos, windows, linux, docker]
    runs-on: ubuntu-latest
    steps:
      # Named one by one rather than "download everything": anything else a job
      # happens to upload would otherwise be attached to the release as a package.
      - uses: actions/download-artifact@v4
        with: { name: macos, path: artifacts }
      - uses: actions/download-artifact@v4
        with: { name: windows, path: artifacts }
      - uses: actions/download-artifact@v4
        with: { name: linux, path: artifacts }

      # The download links in the README point at /releases/latest/download/<name>,
      # which only resolves for a full release — a prerelease would leave them 404.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
